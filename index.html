<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio -->
    <audio id="bg-music" src="assets/ambient-score.mp3" loop></audio>

    <div class="track-container">
        <!-- Background Track Image (A long vertical image) -->
        <img src="assets/track-map.jpg" class="track-bg" alt="Map">
        
        <!-- The Player's Vehicle -->
        <img src="assets/car.png" id="player" alt="Player">

        <!-- Level 1: Amreli -->
        <div class="level-node" id="level-1">
            <img src="assets/amreli-icon.png" class="node-image" alt="Amreli">
            <div class="milestone-media">
                <img src="assets/handloom-memory.png" alt="Early days">
            </div>
        </div>

        <!-- Level 2: IT Industry -->
        <div class="level-node" id="level-2">
            <img src="assets/it-icon.png" class="node-image" alt="IT Industry">
            <div class="milestone-media">
                <video src="assets/coding-montage.mp4" autoplay loop muted></video>
            </div>
        </div>

        <!-- Add Levels 3 and 4 here -->
    </div>

    <!-- GSAP Animation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
