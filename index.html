<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The Start Screen -->
    <div id="start-screen">
        
        <!-- Company Logo (Top Right) -->
        <img src="assets/solplay-logo.png" id="company-logo" alt="Solplay Tech Logo">

        <!-- Welcome Text (Top Center) -->
        <img src="assets/solplay-text.png" id="welcome-text" alt="Welcome to Solplay Tech">

        <div class="welcome-gallery">
            
            <!-- NEW: Profile Card (Photo Left, Text Right) -->
            <div class="profile-card">
                <!-- Left Side: Profile Picture -->
                <img src="assets/my-photo.jpeg" id="intro-photo" alt="Profile">
                
                <!-- Right Side: Name and Roll Number Stack -->
                <div class="profile-details">
                    <img src="assets/my-name.png" class="intro-name-img" alt="Name">
                    <img src="assets/my-rollno.png" class="intro-rollno-img" alt="Roll Number">
                </div>
            </div>
            
            <!-- The OK Button Image (Centered below the profile card) -->
            <img src="assets/ok-button.png" id="ok-btn-img" alt="OK">
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bg-music" src="assets/ambient-score.mp3" loop></audio>
    <audio id="voice-over" src=""></audio>

    <!-- The Main Map -->
    <!-- <div id="map-container">
        <img src="assets/track-map-1.png" id="main-map" alt="World Map">

    <!-- The Main Map (Updated Hotspots) -->
    <div id="map-container">
        <img src="assets/track-map-1.png" id="main-map" alt="World Map">
        
        <!-- Level 1: Amreli -->
        <div class="level-hotspot" id="spot-1" data-voice="assets/voice-level1.wav" 
             data-visuals="assets/Amreli-1.jpeg,assets/Amreli-2.jpg,assets/Amreli-3.jpeg,assets/Amreli-4.jpg,assets/Amreli-1.mp4"></div>
             
        <!-- Level 2: 7-10 -->
        <div class="level-hotspot" id="spot-2" data-voice="assets/voice-level2.wav" 
             data-visuals="assets/junagadh.png,assets/school.png,assets/football.png,assets/basketball.png,assets/chess.png,
             assets/jarvis.png,assets/banglore.png,,assets/Junagadh gir.png"></div>
             
        <!-- Level 3: kota -->
        <div class="level-hotspot" id="spot-3" data-voice="assets/voice-level3.wav" 
             data-visuals="assets/Kota.png,assets/Resonance.png,assets/Kota-Me.png"></div>
             
        <!-- Level 4: pune btech -->
        <div class="level-hotspot" id="spot-4" data-voice="assets/voice-level4.wav" 
             data-visuals="assets/Pune.png,assets/Mitwpu.png,assets/Xplorazzi.png,assets/Pune - 1.png"></div>

        <!-- Level 5: pune company -->
        <div class="level-hotspot" id="spot-5" data-voice="assets/voice-level5.wav" 
             data-visuals="assets/baner.png,assets/Sodaless.png,assets/Sports-sodaless.png,assets/Sports-sodaless 1.png,assets/Sodaless1.png,assets/iit b.png"></div>

        <!-- Level 6: nitt -->
        <div class="level-hotspot" id="spot-6" data-voice="assets/voice-level6.wav" 
             data-visuals="assets/thuvakudi-campus.jpg,assets/ai-lab.jpg,assets/data-science-project.jpg"></div>

        <!-- Level 7: goals -->
        <div class="level-hotspot" id="spot-7" data-voice="assets/voice-level7.wav" 
             data-visuals="assets/thuvakudi-campus.jpg,assets/ai-lab.jpg,assets/data-science-project.jpg"></div>
             
        <!-- Keep spots 5-7 similar with their respective images -->
    </div>

    <!-- The Pop-up Overlay -->
    <div id="story-overlay">
        <img id="prev-btn" class="nav-arrow" src="assets/arrow-left.png" alt="Previous">
        
        <!-- NEW: We now have BOTH an image and a video element -->
        <img id="overlay-img" class="media-display" src="" alt="Story Visual">
        <video id="overlay-video" class="media-display" src="" autoplay loop muted></video>
        
        <img id="next-btn" class="nav-arrow" src="assets/arrow-right.png" alt="Next">
        <img id="close-btn" src="assets/close-icon.png" alt="Close">
    </div>

    <!-- The Pop-up Overlay (Hidden by default) -->
    <div id="story-overlay">
        <img id="overlay-visual" src="" alt="Story Visual">
        <!-- A simple back button icon -->
        <img id="close-btn" src="assets/close-icon.png" alt="Close">
    </div>

    <script src="script.js"></script>
</body>
</html>
